name: subkamyaab_recruiter_app
description: "Subkamyaab Recruiter - Post jobs, hire freelancers and manage hiring (Recruiter / Client App)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Fonts (Inter)
  google_fonts: ^6.2.1

  # Networking (wired up now, connected to real API later)
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI utilities
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    # Bundled Inter weights so bold text works offline (google_fonts uses these).
    - assets/google_fonts/
  # Inter registered as one family so any TextStyle(fontWeight: ...) renders
  # the real weight (works offline, no google_fonts download needed).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Inter-ExtraBold.ttf
          weight: 800

# ── App icon: `dart run flutter_launcher_icons` ──────────────
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#0B4DA2"
  windows:
    generate: true
    image_path: assets/images/app_icon.png

# ── Native splash: `dart run flutter_native_splash:create` ───
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_android12.png
    icon_background_color: "#FFFFFF"
  web: true
